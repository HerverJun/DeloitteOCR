[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "image-classification-platform"
version = "0.2.0"
description = "Local image classification workspace with reproducible datasets and ONNX inference"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.124.4", "uvicorn==0.38.0", "python-multipart==0.0.20",
  "Pillow==11.3.0", "numpy==2.2.6", "jsonschema==4.25.1",
]

[project.optional-dependencies]
runtime-gpu = ["onnxruntime-gpu==1.26.0"]
runtime-cpu = ["onnxruntime==1.26.0"]
ml = ["torch==2.9.1", "torchvision==0.24.1", "timm==1.0.29", "onnx==1.21.0", "onnxruntime-gpu==1.26.0", "scikit-learn==1.7.2"]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.0"]

[project.scripts]
image-platform = "image_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
